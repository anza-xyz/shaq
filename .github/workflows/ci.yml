name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  toml-format:
    name: Check TOML formatting and sorting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tombi
        uses: tombi-toml/setup-tombi@d8f3250344c4e9107b91c02bc11efcf72baf5793 # v1.7.3

      - name: Check TOML formatting and sorting
        run: tombi format --check --diff

  check-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo registry + build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Rustfmt check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy lint
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check documentation
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build release
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --locked --release

      - name: Cargo check
        run: cargo check --locked --all-targets

      - name: Run tests
        run: cargo test --locked --all-targets

  loom:
    name: Loom protocol tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Run Loom tests
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
          RUSTFLAGS: "--cfg loom"
        run: cargo test --locked --release --lib broadcast::loom_tests

  minimal-versions:
    name: Check minimal-versions
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly

      - name: Install minimal-version tools
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7  # v2.87.23
        with:
          tool: cargo-hack,cargo-minimal-versions

      - name: Run minimal-versions check
        run: cargo minimal-versions check --direct
